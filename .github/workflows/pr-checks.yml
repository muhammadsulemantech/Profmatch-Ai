name: Architecture, Schema & Security Guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-guardrails:
    name: Schema, SEO, Build Integrity & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run offline architecture & security suites
        run: >
          node --test
          tests/rate-limiting.test.mjs
          tests/seo-technical-audit.test.mjs
          tests/build-integrity.test.mjs
          tests/otp-security.test.mjs
          tests/schema-reconciliation.test.mjs
          tests/admin-plan-tiers.test.mjs
          tests/verified-pipeline.test.mjs
          tests/email-delivery-failure.test.mjs
          tests/auth-confirmation.test.mjs
          tests/password-reset.test.mjs
          tests/tier2-observability-critical-paths.test.mjs
          tests/cv-parser.test.mjs
          tests/cv-instant-match.test.mjs
